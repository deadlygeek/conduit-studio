[package]
name = "conduit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "conduit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
conduit-core = { version = "0.1.0", path = "../conduit-core" }
conduit-ipc = { version = "0.1.0", path = "../conduit-ipc" }
conduit-nodes = { version = "0.1.0", path = "../conduit-nodes" }
notify-debouncer-mini = "0.7.0"
ratatui = "0.30.2"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
