[package]
name = "conduit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "conduit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
conduit-core = { version = "0.1.0", path = "../conduit-core" }
conduit-nodes = { version = "0.1.0", path = "../conduit-nodes" }

[dev-dependencies]
tempfile = "3.27.0"
